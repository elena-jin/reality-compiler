[project]
name = "reality-compiler"
version = "0.1.0"
description = "Hardware commercialization: idea to prototype to manufacturing in under 60 seconds"
requires-python = ">=3.11"
dependencies = [
    "fastapi[standard]>=0.115.0",
    "uvicorn[standard]>=0.34.0",
    "pydantic>=2.10.0",
    "httpx>=0.28.0",
    "trimesh>=4.0.0",
    "numpy>=1.24.0",
]

[build-system]
requires = ["setuptools>=75.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["backend*"]
